<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GermanApp | Student Portal</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">

    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            yellow: '#FED74C',
                            yellowLight: '#FFF5CA',
                            lavender: '#DACDFF',
                            lavenderLight: '#F3EFFF',
                            coral: '#FA7143',
                            coralLight: '#FFE9E2',
                            dark: '#161618',
                            darkMuted: '#242428',
                            cream: '#FAF8F5',
                            mint: '#A7F3D0',
                            mintDark: '#065F46'
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    },
                    boxShadow: {
                        'chunky': '0 8px 0px 0px rgba(22, 22, 24, 0.95)',
                        'chunky-sm': '0 4px 0px 0px rgba(22, 22, 24, 0.9)',
                        'chunky-press': '0 2px 0px 0px rgba(22, 22, 24, 0.9)',
                    }
                }
            }
        }
    </script>

    <!-- Custom Shared Stylesheet -->
    <link rel="stylesheet" href="css/main.css">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#121214] text-brand-dark antialiased font-sans min-h-screen flex justify-center selection:bg-brand-yellow">
    <div id="root" class="w-full"></div>

    <!-- External Student Application Script -->
    <script type="text/babel" src="js/student-portal.js"></script>
</body>
</html>
