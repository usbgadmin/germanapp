<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Course Map Level B1 | GermanApp Online</title>

    <!-- Google Fonts Plus Jakarta Sans & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            yellow: '#FED74C',
                            yellowLight: '#FFF6D1',
                            lavender: '#DACDFF',
                            lavenderLight: '#F3EFFF',
                            coral: '#FA7143',
                            coralLight: '#FFE9E2',
                            dark: '#161618',
                            darkMuted: '#242428',
                            cream: '#FAF8F5',
                            mint: '#A7F3D0',
                            mintDark: '#065F46',
                            sky: '#BAE6FD',
                            skyDark: '#0369A1'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    },
                    boxShadow: {
                        'chunky': '0 6px 0px 0px #161618',
                        'chunky-lg': '0 8px 0px 0px #161618',
                        'chunky-sm': '0 3.5px 0px 0px #161618',
                        'chunky-press': '0 1px 0px 0px #161618',
                    }
                }
            }
        }
    </script>

    <!-- External Custom Stylesheet -->
    <link rel="stylesheet" href="css/main.css">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#121214] text-brand-dark antialiased font-sans min-h-screen flex justify-center selection:bg-brand-yellow">
    <div id="root" class="w-full"></div>

    <!-- External React Script -->
    <script type="text/babel" src="js/course-map-b1.js"></script>
</body>
</html>
