        // Web Audio Synthesizer
        const playFeedbackSound = (type = 'success') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.setValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'station-chime') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(349.23, now);
                    osc.frequency.setValueAtTime(523.25, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {}

                            <p>&bull; <strong>Regelmäßig (-te):</strong> ich probierte aus, du probiertest aus, er probierte aus, wir probierten aus.</p>
                            <p>&bull; <strong>Unregelmäßig (Vokalwechsel):</strong> ich sah, du sahst, er sah, wir sahen, ihr saht, sie sahen.</p>
                            <p>&bull; <strong>Mischverben:</strong> wusste (wissen), dachte (denken), brachte (bringen), kannte (kennen).</p>
                        </div>
                    )}

                    {activeKlarTab === 'grammar2' && (
                        <div className="p-3.5 bg-brand-cream rounded-2xl border-2 border-brand-dark/20 text-xs space-y-2">
                            <strong className="text-brand-coral uppercase block">Zeitangaben (Temporale Präpositionen):</strong>
                            <p>&bull; <strong>Mit Dativ:</strong> ab, an, bis zu, in, nach, seit, vor (z. B. <em>vor der Arbeit, seit dem Umzug, nach dem Essen</em>).</p>
                            <p>&bull; <strong>Mit Genitiv:</strong> außerhalb, innerhalb, während (z. B. <em>außerhalb der Ferien, während des Sommers, innerhalb einer Stunde</em>).</p>
                        </div>
                    )}

                    {activeKlarTab === 'checklist' && (
                        <div className="space-y-2 text-xs">
                            {CHECKLIST_ITEMS.map(item => {
                                const isDone = checklistChecked[item.id];
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => toggleCheck(item.id)}
                                        className={`w-full text-left p-3 rounded-2xl border-2 transition cursor-pointer flex items-start gap-2.5 ${
                                            isDone ? 'bg-emerald-50 border-emerald-500 text-emerald-950' : 'bg-white border-zinc-200 text-zinc-700'
                                        }`}
                                    >
                                        <span className={`w-5 h-5 rounded-md border flex items-center justify-center text-xs shrink-0 mt-0.5 ${
                                            isDone ? 'bg-emerald-600 text-white border-emerald-700' : 'border-zinc-300 bg-zinc-100'
                                        }`}>
                                            {isDone ? '✓' : ''}
                                        </span>
                                        <div>
                                            <span className="font-black text-xs block text-brand-dark">{item.text}</span>
                                            <span className="text-[10.5px] opacity-75 italic block">{item.textDe}</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const ScoreBreakdownModal = ({ isOpen, onClose, xp, level, streak }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl border-3 border-brand-dark shadow-chunky-lg max-w-sm w-full p-5 space-y-4">
                        <div className="flex items-center justify-between border-b border-zinc-100 pb-2">
                            <div className="flex items-center gap-2">
                                <span className="material-symbols-rounded text-brand-yellow text-2xl">emoji_events</span>
                                <h4 className="text-base font-black text-brand-dark">Score &amp; Progress</h4>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="w-7 h-7 rounded-full bg-zinc-100 hover:bg-zinc-200 text-brand-dark font-black flex items-center justify-center cursor-pointer"
                            >
                                &times;
                            </button>
                        </div>

                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="p-2.5 bg-brand-yellowLight rounded-2xl border border-brand-yellow">
                                <span className="text-[10px] font-bold text-zinc-500 uppercase block">Total XP</span>
                                <span className="text-base font-black text-brand-dark">{xp}</span>
                            </div>
                            <div className="p-2.5 bg-brand-lavenderLight rounded-2xl border border-brand-lavender">
                                <span className="text-[10px] font-bold text-zinc-500 uppercase block">Level</span>
                                <span className="text-base font-black text-brand-dark">{level}</span>
                            </div>
                            <div className="p-2.5 bg-brand-coralLight rounded-2xl border border-brand-coral">
                                <span className="text-[10px] font-bold text-zinc-500 uppercase block">Streak</span>
                                <span className="text-base font-black text-brand-coral">{streak}d</span>
                            </div>
                        </div>

                        <p className="text-xs text-zinc-600 font-medium text-center leading-relaxed">
                            Mastering Kapitel 3: Veränderungen and Plattform 1 takes you to intermediate B1 proficiency!
                        </p>

                        <button
                            type="button"
                            onClick={onClose}
                            className="w-full py-2 bg-brand-dark text-white font-black text-xs rounded-full cursor-pointer hover:bg-zinc-800"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );
        };

        function App() {
            const [activeSection, setActiveSection] = useState('guide');
            const [englishMode, setEnglishMode] = useState(() => {
                try {
                    return localStorage.getItem('germanapp_english_mode') === 'true';
                } catch (e) {
                    return true;
                }
            });

            const [isDesktopView, setIsDesktopView] = useState(() => {
                try {
                    return localStorage.getItem(STORAGE_KEY_DESKTOP_VIEW) === 'true';
                } catch (e) {
                    return false;
                }
            });

            const toggleDesktopView = () => {
                setIsDesktopView(prev => {
                    const nextState = !prev;
                    try {
                        localStorage.setItem(STORAGE_KEY_DESKTOP_VIEW, String(nextState));
                        if (nextState) {
                            document.documentElement.classList.add('desktop-view-mode');
                        } else {
                            document.documentElement.classList.remove('desktop-view-mode');
                        }
                    } catch (e) {}
                    return nextState;
                });
            };

            const [scoreState, setScoreState] = useState(() => {
                try {
                    const saved = localStorage.getItem('germanapp_student_score');
                    return saved ? JSON.parse(saved) : { xp: 1450, level: 3, streak: 7 };
                } catch (e) {
                    return { xp: 1450, level: 3, streak: 7 };
                }
            });

            const [showProfileDropdown, setShowProfileDropdown] = useState(false);
            const [showScoreModal, setShowScoreModal] = useState(false);
            const tabsScrollRef = useRef(null);

            const toggleEnglish = () => {
                setEnglishMode(prev => {
                    const next = !prev;
                    try {
                        localStorage.setItem('germanapp_english_mode', String(next));
                    } catch (e) {}
                    return next;
                });
            };

            const awardXp = (amount) => {
                setScoreState(prev => {
                    const nextXp = prev.xp + amount;
                    const nextLevel = Math.floor(nextXp / 500) + 1;
                    const updated = { ...prev, xp: nextXp, level: nextLevel };
                    try {
                        localStorage.setItem('germanapp_student_score', JSON.stringify(updated));
                    } catch (e) {}
                    return updated;
                });
            };

            const scrollTabs = (offset) => {
                if (tabsScrollRef.current) {
                    tabsScrollRef.current.scrollBy({ left: offset, behavior: 'smooth' });
                }
            };

            const currentIndex = SECTIONS.findIndex(s => s.id === activeSection);

            useEffect(() => {
                if (tabsScrollRef.current) {
                    const activeBtn = tabsScrollRef.current.querySelector(`[data-tab-id="${activeSection}"]`);
                    if (activeBtn) {
                        const container = tabsScrollRef.current;
                        const btnLeft = activeBtn.offsetLeft;
                        const btnWidth = activeBtn.offsetWidth;
                        const containerWidth = container.offsetWidth;
                        container.scrollTo({
                            left: btnLeft - containerWidth / 2 + btnWidth / 2,
                            behavior: 'smooth'
                        });
                    }
                }
            }, [activeSection]);

            return (
                <div className={`w-full ${isDesktopView ? 'max-w-5xl lg:max-w-6xl' : 'max-w-xl md:max-w-2xl'} mx-auto min-h-screen bg-brand-cream pb-28 relative shadow-2xl overflow-x-hidden transition-all duration-300`}>
                    <header className="sticky top-0 z-30 bg-brand-cream/95 backdrop-blur-md px-4 pt-3.5 pb-2.5 border-b-2 border-brand-dark/10 flex items-center justify-between">
                        <div>
                            <div className="inline-flex items-center gap-1.5 bg-brand-dark text-white px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wide">
                                <span>GermanApp</span>
                                <span className="text-brand-yellow">✦</span>
                                <span>B1.1</span>
                            </div>
                            <h1 className="text-lg sm:text-xl font-black tracking-tight text-brand-dark mt-0.5">
                                Kapitel 3: Veränderungen &amp; Plattform 1
                            </h1>
                        </div>

                        <div className="flex items-center gap-1.5 sm:gap-2">
                            <button
                                type="button"
                                onClick={toggleEnglish}
                                className={`px-2.5 py-1 rounded-full text-xs font-black border-2 border-brand-dark flex items-center gap-1 transition cursor-pointer shadow-chunky-sm ${
                                    englishMode ? 'bg-brand-coral text-white' : 'bg-white text-zinc-600 hover:bg-zinc-100'
                                }`}
                                title="Toggle English Support"
                            >
                                <span className="material-symbols-rounded text-sm">translate</span>
                                <span className="hidden sm:inline">{englishMode ? 'EN Help: ON' : 'EN Help: OFF'}</span>
                            </button>

                            <button
                                type="button"
                                onClick={() => setShowScoreModal(true)}
                                className="flex items-center gap-1 bg-brand-yellowLight border-2 border-brand-dark px-2.5 py-1 rounded-full shadow-chunky-sm text-xs font-black text-brand-dark cursor-pointer hover:bg-yellow-200"
                            >
                                <span className="material-symbols-rounded text-brand-coral text-sm">stars</span>
                                <span>{scoreState.xp} XP</span>
                            </button>

                            <div className="relative">
                                <button
                                    type="button"
                                    onClick={() => setShowProfileDropdown(!showProfileDropdown)}
                                    className="cursor-pointer"
                                    aria-label="Open Course Menu"
                                >
                                    <GermanFlagIcon className="w-8 h-8" />
                                </button>

                                {showProfileDropdown && (
                                    <>
                                        <div className="fixed inset-0 z-40" onClick={() => setShowProfileDropdown(false)}></div>
                                        <div className="absolute right-0 top-full mt-2 w-56 bg-white border-2 border-brand-dark rounded-2xl shadow-chunky p-1.5 z-50 animate-in fade-in duration-100 space-y-1">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setShowProfileDropdown(false);
                                                    toggleDesktopView();
                                                }}
                                                className="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <div className="flex items-center gap-2">
                                                    <span className="material-symbols-rounded text-base text-brand-coral">
                                                        {isDesktopView ? 'smartphone' : 'desktop_windows'}
                                                    </span>
                                                    <span>Desktop View</span>
                                                </div>
                                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${isDesktopView ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-zinc-100 text-zinc-500 border-zinc-200'}`}>
                                                    {isDesktopView ? 'Active' : 'Toggle'}
                                                </span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={() => {
                                                    window.location.href = 'ch1-b1-coursebook.html';
                                                    setShowProfileDropdown(false);
                                                }}
                                                className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <span className="material-symbols-rounded text-base text-brand-coral">school</span>
                                                <span>Chapter 1</span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={() => {
                                                    window.location.href = 'ch2-b1-coursebook.html';
                                                    setShowProfileDropdown(false);
                                                }}
                                                className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <span className="material-symbols-rounded text-base text-brand-coral">school</span>
                                                <span>Chapter 2</span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={() => {
                                                    window.location.href = 'ch3-b1-coursebook.html';
                                                    setShowProfileDropdown(false);
                                                }}
                                                className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <span className="material-symbols-rounded text-base text-brand-coral">school</span>
                                                <span>Chapter 3</span>
                                            </button>
                                           
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs - Distinct Page by Page */}
                    <div className="px-3 pt-3 flex items-center gap-1">
                        <button
                            type="button"
                            onClick={() => scrollTabs(-180)}
                            className="w-8 h-8 rounded-full bg-white border-2 border-brand-dark flex items-center justify-center shrink-0 shadow-chunky-sm hover:bg-zinc-100 cursor-pointer"
                            aria-label="Scroll left"
                        >
                            <span className="material-symbols-rounded text-base">chevron_left</span>
                        </button>

                        <div ref={tabsScrollRef} className="flex-1 overflow-x-auto hide-scrollbar flex items-center gap-1.5 py-1">
                            {SECTIONS.map(s => (
                                <button
                                    key={s.id}
                                    data-tab-id={s.id}
                                    type="button"
                                    onClick={() => {
                                        playFeedbackSound('click');
                                        setActiveSection(s.id);
                                    }}
                                    className={`px-3 py-1.5 rounded-full text-xs font-black shrink-0 border border-brand-dark flex items-center gap-1 transition cursor-pointer ${
                                        activeSection === s.id
                                            ? 'bg-brand-dark text-white shadow-chunky-sm'
                                            : 'bg-white text-zinc-700 hover:bg-brand-yellowLight'
                                    }`}
                                >
                                    <span className="material-symbols-rounded text-sm">{s.icon}</span>
                                    <span>{s.label}</span>
                                </button>
                            ))}
                        </div>

                        <button
                            type="button"
                            onClick={() => scrollTabs(180)}
                            className="w-8 h-8 rounded-full bg-white border-2 border-brand-dark flex items-center justify-center shrink-0 shadow-chunky-sm hover:bg-zinc-100 cursor-pointer"
                            aria-label="Scroll right"
                        >
                            <span className="material-symbols-rounded text-base">chevron_right</span>
                        </button>
                    </div>

                    <main className="px-3 sm:px-4 mt-3">
                        {activeSection === 'guide' && (
                            <div className="bg-brand-lavenderLight rounded-3xl p-5 border-2 border-brand-dark shadow-chunky-sm space-y-4">
                                <div>
                                    <div className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-brand-dark text-brand-yellow rounded-full text-[10px] font-black uppercase mb-1">
                                        Kapitel 3 &amp; Plattform 1 Roadmap
                                    </div>
                                    <h3 className="text-base sm:text-lg font-black text-brand-dark">
                                        Kapitel 3: „Veränderungen“ &amp; Plattform 1 Review
                                    </h3>
                                    <p className="text-xs text-brand-dark font-medium leading-relaxed mt-1">
                                        Explore societal, professional, and personal changes. Master the <strong>Präteritum</strong> tense, learn temporal prepositions with <strong>Dativ</strong> and <strong>Genitiv</strong>, play the <strong>Punkterennen</strong> review game, and discover the history of the <strong>Berlin Wall</strong>.
                                    </p>
                                </div>

                                <GermanyDestinationsMap onSelectDestination={(p) => setActiveSection(p)} activeDestId="berlin" />

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                                    <div className="p-3 bg-white rounded-2xl border border-brand-dark/20 space-y-1">
                                        <div className="flex items-center gap-1.5 font-black text-brand-coral">
                                            <span className="material-symbols-rounded text-base">psychology</span>
                                            <span>Grammar Systems</span>
                                        </div>
                                        <p className="text-zinc-600 text-[11px] leading-snug">
                                            Master <em>Präteritum</em> (regular, irregular, modal verbs) and temporal prepositions (<em>während, innerhalb, nach, seit</em>).
                                        </p>
                                    </div>

                                    <div className="p-3 bg-white rounded-2xl border border-brand-dark/20 space-y-1">
                                        <div className="flex items-center gap-1.5 font-black text-brand-coral">
                                            <span className="material-symbols-rounded text-base">explore</span>
                                            <span>Real-World Skills</span>
                                        </div>
                                        <p className="text-zinc-600 text-[11px] leading-snug">
                                            Biographical turning points, modern etiquette (Knigge), Doha's boxing documentary, and Berlin Wall memorial paths.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeSection === 'p28' && <Page28Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p29' && <Page29Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p30' && <Page30Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p31' && <Page31Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p32' && <Page32Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p33' && <Page33Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p34' && <Page34Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p35' && <Page35Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p36' && <Page36Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p37' && <Page37Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p38' && <BoardGamePunkterennen englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p40' && <SchreibwerkstattContent englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p42' && <BerlinHistoryContent englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'gram1' && <Grammar1PrateritumUnit englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'gram2' && <Grammar2PrepositionsUnit englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'klar' && <KurzUndKlarMasterclass englishMode={englishMode} />}
                    </main>

                    {/* Bottom Floating Navigation Dock */}
                    <nav className="fixed bottom-3 left-0 right-0 z-40 max-w-xl md:max-w-2xl mx-auto px-4 pointer-events-none">
                        <div className="bg-brand-dark/95 text-white backdrop-blur-md p-2 rounded-full border-2 border-brand-dark shadow-2xl flex items-center justify-between pointer-events-auto">
                            <button
                                type="button"
                                onClick={() => {
                                    if (currentIndex > 0) {
                                        playFeedbackSound('click');
                                        setActiveSection(SECTIONS[currentIndex - 1].id);
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentIndex === 0}
                                className={`flex-1 py-1.5 rounded-full flex items-center justify-center gap-1 text-xs font-black transition cursor-pointer ${
                                    currentIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-zinc-800'
                                }`}
                            >
                                <span className="material-symbols-rounded text-base">arrow_back</span>
                                <span>Back</span>
                            </button>

                            <div className="px-3 py-1 bg-brand-yellow text-brand-dark rounded-full text-xs font-black border border-brand-dark">
                                {SECTIONS[currentIndex].label}
                            </div>

                            <button
                                type="button"
                                onClick={() => {
                                    if (currentIndex < SECTIONS.length - 1) {
                                        playFeedbackSound('click');
                                        setActiveSection(SECTIONS[currentIndex + 1].id);
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentIndex === SECTIONS.length - 1}
                                className={`flex-1 py-1.5 rounded-full flex items-center justify-center gap-1 text-xs font-black transition cursor-pointer ${
                                    currentIndex === SECTIONS.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-zinc-800'
                                }`}
                            >
                                <span>Next</span>
                                <span className="material-symbols-rounded text-base">arrow_forward</span>
                            </button>
                        </div>
                    </nav>

                    <ScoreBreakdownModal
                        isOpen={showScoreModal}
                        onClose={() => setShowScoreModal(false)}
                        xp={scoreState.xp}
                        level={scoreState.level}
                        streak={scoreState.streak}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
