        // Sound Synthesis helper using Web Audio API
        const playFeedbackSound = (type = 'success') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.setValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'station-chime') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(349.23, now);
                    osc.frequency.setValueAtTime(523.25, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {
                // AudioContext fallback
            }
        };

        const AudioTrackPlayer = ({ trackNumber, title, duration = "1:45", transcript, englishTranscript, englishMode, onPlayAudio }) => {

            const togglePlayback = () => {
                if (!isPlaying) {
                    playFeedbackSound('click');
                    setIsPlaying(true);
                    if (onPlayAudio) onPlayAudio(trackNumber);
                } else {
                    setIsPlaying(false);
                }
            };

            const toggleSpeed = () => {
                setPlaybackSpeed(prev => (prev === 1 ? 0.8 : 1));
            };

            return (
                <div className="bg-brand-lavenderLight/70 border-2 border-brand-dark rounded-2xl p-3 my-2 shadow-chunky-sm space-y-2">

                                                className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <span className="material-symbols-rounded text-base text-brand-coral">school</span>
                                                <span>Chapter 2</span>
                                            </button>

                                            <button
                                                type="button"
                                                onClick={() => {
                                                    window.location.href = 'ch3-b1-coursebook.html';
                                                    setShowProfileDropdown(false);
                                                }}
                                                className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black text-brand-dark hover:bg-brand-yellowLight transition text-left cursor-pointer"
                                            >
                                                <span className="material-symbols-rounded text-base text-brand-coral">school</span>
                                                <span>Chapter 3</span>
                                            </button>
                                            
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    <div className="px-3 pt-3 flex items-center gap-1">
                        <button
                            type="button"
                            onClick={() => scrollTabs(-180)}
                            className="w-8 h-8 rounded-full bg-white border-2 border-brand-dark flex items-center justify-center shrink-0 shadow-chunky-sm hover:bg-zinc-100 cursor-pointer"
                            aria-label="Scroll left"
                        >
                            <span className="material-symbols-rounded text-base">chevron_left</span>
                        </button>

                        <div ref={tabsScrollRef} className="flex-1 overflow-x-auto hide-scrollbar flex items-center gap-1.5 py-1">
                            {SECTIONS.map(s => (
                                <button
                                    key={s.id}
                                    data-tab-id={s.id}
                                    type="button"
                                    onClick={() => {
                                        playFeedbackSound('click');
                                        setActiveSection(s.id);
                                    }}
                                    className={`px-3 py-1.5 rounded-full text-xs font-black shrink-0 border border-brand-dark flex items-center gap-1 transition cursor-pointer ${
                                        activeSection === s.id
                                            ? 'bg-brand-dark text-white shadow-chunky-sm'
                                            : 'bg-white text-zinc-700 hover:bg-brand-yellowLight'
                                    }`}
                                >
                                    <span className="material-symbols-rounded text-sm">{s.icon}</span>
                                    <span>{s.label}</span>
                                </button>
                            ))}
                        </div>

                        <button
                            type="button"
                            onClick={() => scrollTabs(180)}
                            className="w-8 h-8 rounded-full bg-white border-2 border-brand-dark flex items-center justify-center shrink-0 shadow-chunky-sm hover:bg-zinc-100 cursor-pointer"
                            aria-label="Scroll right"
                        >
                            <span className="material-symbols-rounded text-base">chevron_right</span>
                        </button>
                    </div>

                    <main className="px-3 sm:px-4 mt-3">
                        {activeSection === 'guide' && (
                            <div className="bg-brand-lavenderLight rounded-3xl p-5 border-2 border-brand-dark shadow-chunky-sm space-y-4">
                                <div>
                                    <div className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-brand-dark text-brand-yellow rounded-full text-[10px] font-black uppercase mb-1">
                                        Kapitel 2 &bull; Study Roadmap
                                    </div>
                                    <h3 className="text-base sm:text-lg font-black text-brand-dark">
                                        Kapitel 2: „Das ist ja praktisch!“ — Nützliche Technik &amp; Alltagshelfer
                                    </h3>
                                    <p className="text-xs text-brand-dark font-medium leading-relaxed mt-1">
                                        Welcome to Chapter 2! Here you will practice discussing everyday gadgets, learning about Smart Homes, mastering service structures with <em>lassen + Infinitiv</em>, consequence clauses, and Genitive prepositions.
                                    </p>
                                </div>

                                <GermanyDestinationsMap onSelectDestination={(p) => setActiveSection(p)} />

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                                    <div className="p-3 bg-white rounded-2xl border border-brand-dark/20 space-y-1">
                                        <div className="flex items-center gap-1.5 font-black text-brand-coral">
                                            <span className="material-symbols-rounded text-base">psychology</span>
                                            <span>Grammar Systems</span>
                                        </div>
                                        <p className="text-zinc-600 text-[11px] leading-snug">
                                            Master <em>lassen + Infinitiv</em>, Genitive structures, and prepositions (<em>wegen / trotz</em>).
                                        </p>
                                    </div>

                                    <div className="p-3 bg-white rounded-2xl border border-brand-dark/20 space-y-1">
                                        <div className="flex items-center gap-1.5 font-black text-brand-coral">
                                            <span className="material-symbols-rounded text-base">build</span>
                                            <span>Real-World Skills</span>
                                        </div>
                                        <p className="text-zinc-600 text-[11px] leading-snug">
                                            Handy reclamation dialogues, Smart Home app controls, brand vocabulary, and Repair Café reportages.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeSection === 'p18' && <Page18Content englishMode={englishMode} onAwardXp={awardXp} onNavigateSection={(p) => setActiveSection(p)} />}
                        {activeSection === 'p19' && <Page19Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p20' && <Page20Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p21' && <Page21Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p22' && <Page22Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p23' && <Page23Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p24' && <Page24Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'p25' && <Page25Content englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'gram1' && <Grammar1LassenUnit englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'gram2' && <Grammar2GenitiveUnit englishMode={englishMode} onAwardXp={awardXp} />}
                        {activeSection === 'klar' && <KurzUndKlarMasterclass englishMode={englishMode} />}
                    </main>

                    <nav className="fixed bottom-3 left-0 right-0 z-40 max-w-xl md:max-w-2xl mx-auto px-4 pointer-events-none">
                        <div className="bg-brand-dark/95 text-white backdrop-blur-md p-2 rounded-full border-2 border-brand-dark shadow-2xl flex items-center justify-between pointer-events-auto">
                            <button
                                type="button"
                                onClick={() => {
                                    if (currentIndex > 0) {
                                        playFeedbackSound('click');
                                        setActiveSection(SECTIONS[currentIndex - 1].id);
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentIndex === 0}
                                className={`flex-1 py-1.5 rounded-full flex items-center justify-center gap-1 text-xs font-black transition cursor-pointer ${
                                    currentIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-zinc-800'
                                }`}
                            >
                                <span className="material-symbols-rounded text-base">arrow_back</span>
                                <span>Back</span>
                            </button>

                            <div className="px-3 py-1 bg-brand-yellow text-brand-dark rounded-full text-xs font-black border border-brand-dark">
                                {SECTIONS[currentIndex].label}
                            </div>

                            <button
                                type="button"
                                onClick={() => {
                                    if (currentIndex < SECTIONS.length - 1) {
                                        playFeedbackSound('click');
                                        setActiveSection(SECTIONS[currentIndex + 1].id);
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentIndex === SECTIONS.length - 1}
                                className={`flex-1 py-1.5 rounded-full flex items-center justify-center gap-1 text-xs font-black transition cursor-pointer ${
                                    currentIndex === SECTIONS.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-zinc-800'
                                }`}
                            >
                                <span>Next</span>
                                <span className="material-symbols-rounded text-base">arrow_forward</span>
                            </button>
                        </div>
                    </nav>

                    <ScoreBreakdownModal
                        isOpen={showScoreModal}
                        onClose={() => setShowScoreModal(false)}
                        xp={scoreState.xp}
                        level={scoreState.level}
                        streak={scoreState.streak}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
