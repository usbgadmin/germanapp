<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | GermanApp Online</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            yellow: '#FED74C',
                            yellowLight: '#FFF6D1',
                            lavender: '#DACDFF',
                            lavenderLight: '#F3EFFF',
                            coral: '#FA7143',
                            coralLight: '#FFE9E2',
                            dark: '#161618',
                            darkMuted: '#242428',
                            cream: '#FAF8F5',
                            mint: '#A7F3D0',
                            mintDark: '#065F46'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    },
                    boxShadow: {
                        'chunky': '0 6px 0px 0px #161618',
                        'chunky-lg': '0 8px 0px 0px #161618',
                        'chunky-sm': '0 3.5px 0px 0px #161618',
                        'chunky-press': '0 1px 0px 0px #161618',
                    }
                }
            }
        }
    </script>

    <!-- Custom Shared Stylesheet -->
    <link rel="stylesheet" href="CSS/main.css">

    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-[#121214] text-brand-dark antialiased font-sans min-h-screen flex items-center justify-center p-3 sm:p-6 selection:bg-brand-yellow login-page">

    <!-- Main Container Card -->
    <main class="w-full max-w-md bg-brand-cream rounded-4xl sm:rounded-5xl border-3 sm:border-4 border-brand-dark shadow-chunky-lg overflow-hidden relative p-5 sm:p-7">
        
        <!-- Header Sparkles & Mascot -->
        <div class="flex items-start justify-between gap-3 mb-4">
            <div>
                <div class="inline-flex items-center gap-1.5 bg-brand-dark text-white px-3.5 py-1 rounded-full text-xs font-black tracking-wide">
                    <span>GermanApp</span>
                    <span class="text-brand-yellow">✦</span>
                    <span class="text-[10px] text-zinc-300 font-bold uppercase tracking-wider">Portal</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-brand-dark tracking-tight mt-1.5 leading-tight">
                    Willkommen!
                </h1>
                <p class="text-xs sm:text-sm font-semibold text-zinc-600 mt-0.5">
                    Sign in to continue your German study streak.
                </p>
            </div>

            <!-- German Flag Badge Icon -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 shrink-0 bg-brand-yellowLight rounded-3xl border-2 sm:border-3 border-brand-dark shadow-chunky-sm flex items-center justify-center animate-mascot p-2 relative overflow-hidden" title="Deutsch Lernen">
                <svg viewBox="0 0 64 64" class="w-12 h-12 sm:w-14 sm:h-14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="flagRoundedClip">
                        <rect x="4" y="10" width="56" height="44" rx="12" />
                    </clipPath>
                    <g clip-path="url(#flagRoundedClip)">
                        <rect x="4" y="10" width="56" height="14.66" fill="#161618" />
                        <rect x="4" y="24.66" width="56" height="14.68" fill="#E11D48" />
                        <rect x="4" y="39.34" width="56" height="14.66" fill="#FED74C" />
                        <path d="M4 10 L60 10 L4 44 Z" fill="#FFFFFF" opacity="0.12" />
                    </g>
                    <rect x="4" y="10" width="56" height="44" rx="12" stroke="#161618" stroke-width="3" fill="none" />
                </svg>
            </div>
        </div>

        <!-- Google OAuth Button -->
        <section class="mt-2 mb-5">
            <button 
                type="button" 
                id="customGoogleBtn"
                class="w-full group bg-white hover:bg-zinc-50 text-brand-dark py-3.5 sm:py-4 px-4 rounded-3xl border-2 sm:border-3 border-brand-dark shadow-chunky hover:shadow-chunky-sm active:translate-y-1 active:shadow-chunky-press transition-all flex items-center justify-center gap-3 relative overflow-hidden cursor-pointer"
            >
                <span class="w-8 h-8 sm:w-9 sm:h-9 bg-white rounded-full flex items-center justify-center shrink-0 border border-zinc-200 shadow-sm group-hover:scale-105 transition-transform">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 sm:w-6 sm:h-6" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                </span>

                <div class="text-left leading-tight">
                    <span class="block text-sm sm:text-base font-black text-brand-dark tracking-tight">
                        Continue with Google
                    </span>
                    <span class="block text-[10px] sm:text-[11px] font-bold text-zinc-500">
                        Fast &amp; secure 1-tap authentication
                    </span>
                </div>

                <span class="ml-auto w-7 h-7 rounded-full bg-brand-yellow text-brand-dark flex items-center justify-center font-black text-xs border border-brand-dark shadow-chunky-sm">
                    ➔
                </span>
            </button>
        </section>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-[2px] bg-brand-dark/15"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500 bg-white px-3 py-1 rounded-full border border-black/10">
                Or sign in with username
            </span>
            <div class="flex-1 h-[2px] bg-brand-dark/15"></div>
        </div>

        <!-- Credentials Form -->
        <form id="loginForm" class="space-y-3.5">
            <div>
                <label for="username" class="text-xs font-black text-brand-dark uppercase tracking-wider block mb-1 flex items-center gap-1">
                    <span class="material-symbols-rounded text-sm text-brand-coral">person</span>
                    <span>Username or Email</span>
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    autocomplete="username"
                    placeholder="e.g. haikal or admin" 
                    class="w-full bg-white border-2 border-brand-dark rounded-2xl px-4 py-3 text-xs sm:text-sm font-bold text-brand-dark placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-yellow shadow-sm transition"
                >
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="text-xs font-black text-brand-dark uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-rounded text-sm text-brand-coral">lock</span>
                        <span>Password</span>
                    </label>
                    <button 
                        type="button" 
                        id="togglePasswordBtn"
                        class="text-[11px] font-bold text-zinc-500 hover:text-brand-dark transition inline-flex items-center gap-0.5"
                    >
                        <span class="material-symbols-rounded text-xs" id="pwdToggleIcon">visibility</span>
                        <span id="pwdToggleLabel">Show</span>
                    </button>
                </div>

                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    autocomplete="current-password"
                    placeholder="••••••••" 
                    class="w-full bg-white border-2 border-brand-dark rounded-2xl px-4 py-3 text-xs sm:text-sm font-bold text-brand-dark placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-yellow shadow-sm transition pr-10"
                >
            </div>

            <button 
                type="submit" 
                id="loginBtn"
                class="w-full bg-brand-dark hover:bg-zinc-800 text-white py-3.5 sm:py-4 px-4 rounded-2xl sm:rounded-3xl font-black text-xs sm:text-sm border-2 border-brand-dark shadow-chunky hover:shadow-chunky-sm active:translate-y-0.5 active:shadow-chunky-press transition flex items-center justify-center gap-2 mt-2"
            >
                <span class="material-symbols-rounded text-base sm:text-lg">login</span>
                <span>Sign In to Dashboard</span>
            </button>
        </form>

        <!-- Direct Portal Nav Switchers -->
        <div class="mt-5 pt-4 border-t border-brand-dark/10">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-extrabold text-zinc-500 uppercase tracking-wider">Quick Portal Access:</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <a 
                    href="ch1-b1-coursebook.html" 
                    class="bg-brand-yellowLight hover:bg-brand-yellow text-brand-dark font-black text-[11px] py-2 px-3 rounded-xl border border-brand-dark/30 flex items-center justify-center gap-1 transition"
                >
                    <span class="material-symbols-rounded text-sm">school</span>
                    <span>Student Portal</span>
                </a>
                <a 
                    href="admin-portal.html" 
                    class="bg-brand-lavenderLight hover:bg-brand-lavender text-brand-dark font-black text-[11px] py-2 px-3 rounded-xl border border-brand-dark/30 flex items-center justify-center gap-1 transition"
                >
                    <span class="material-symbols-rounded text-sm">admin_panel_settings</span>
                    <span>Admin Studio</span>
                </a>
            </div>
        </div>

        <footer class="mt-4 text-center">
            <p class="text-[10px] font-extrabold text-zinc-500">
                &copy; 2026 GermanApp Online &bull; Deutsch Lernen mit Freude
            </p>
        </footer>

        <!-- Toast Container -->
        <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-brand-dark text-white text-xs font-black px-4 py-2.5 rounded-full shadow-2xl items-center gap-2 border border-brand-yellow hidden transition-all duration-300">
            <span class="w-2 h-2 rounded-full bg-brand-yellow animate-pulse"></span>
            <span id="toastMessage">Message</span>
        </div>

    </main>

    <!-- External Script -->
    <script src="js/login.js"></script>

</body>
</html>
