<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kapitel 1: Gute Reise! - Complete Coursebook | GermanApp B1.1</title>

    <script>
      (function() {
        try {
          if (localStorage.getItem('germanapp_desktop_view') === 'true') {
            document.documentElement.classList.add('desktop-view-mode');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            yellow: '#FED74C', yellowLight: '#FFF6D1', lavender: '#DACDFF', lavenderLight: '#F3EFFF',
                            coral: '#FA7143', coralLight: '#FFE9E2', dark: '#161618', darkMuted: '#242428', cream: '#FAF8F5',
                            mint: '#A7F3D0', mintDark: '#065F46', sky: '#BAE6FD', skyDark: '#0369A1'
                        }
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' },

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#121214] text-brand-dark antialiased font-sans min-h-screen flex justify-center selection:bg-brand-yellow">
    <div id="root" class="w-full"></div>

    <!-- Modular Script Inclusions -->
    <script type="text/babel" src="js/core.js"></script>
    <script type="text/babel" src="js/ch1-content.js"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <App

                sections={SECTIONS_CH1}
                renderSectionContent={renderCh1Content}
            />
        );
    </script>
