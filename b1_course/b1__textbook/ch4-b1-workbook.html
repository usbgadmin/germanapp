        const AudioPlayerCard = ({ title, src, onPlay }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const audio = audioRef.current;
                return () => {
                    if (audio) {
                        try {
                            audio.pause();
                        } catch (e) {}
                    }
                };
            }, [src]);

            const toggleAudio = () => {
                const audio = audioRef.current;
                if (!audio) return;

                if (!audio.paused) {
                    audio.pause();
                    setIsPlaying(false);
                } else {
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                setIsPlaying(true);
                                if (onPlay) onPlay(title);
                            })
                            .catch((err) => {
                                if (err.name !== 'AbortError') {
                                    console.warn('Audio playback error:', err);
                                }
                                setIsPlaying(false);
                            });
                    }
                }
            };

            return (
                <div className="bg-white border-2 border-brand-dark rounded-2xl p-2.5 sm:p-3 flex items-center justify-between gap-3 shadow-chunky-sm">
                    <div className="flex items-center gap-2.5 truncate">

                            onClick={toggleAudio}
                            className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 border-2 border-brand-dark shadow-chunky-sm transition active:translate-y-0.5 ${
                                isPlaying ? 'bg-brand-coral text-white' : 'bg-brand-yellow text-brand-dark hover:bg-yellow-400'
                            }`}
                            aria-label={isPlaying ? 'Pause Audio' : 'Play Audio'}
                        >

                        </div>
                    </div>
                    <audio 
                        ref={audioRef} 
                        src={src} 
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        onEnded={() => setIsPlaying(false)}

                    </a>

            );

                                        <span>2. Kann das doch passieren mal =</span>
                                        <select
                                            value={exR2Answers[2]}
                                            onChange={e => setExR2Answers({ ...exR2Answers, 2: e.target.value })}
                                            className={`bg-white border-2 rounded-xl px-2.5 py-1 text-xs font-black ${
                                                exR2Checked ? (exR2Answers[2] === exR2Solutions[2] ? 'border-emerald-600 bg-emerald-50' : 'border-red-500 bg-red-50') : 'border-brand-dark'
                                            }`}
                                        >
                                            <option value="">-- Satz --</option>
                                            <option value="Das kann doch mal passieren.">Das kann doch mal passieren.</option>
                                            <option value="Kann passieren mal so.">Kann passieren mal so.</option>
                                        </select>
                                    </div>
                                </div>

                                <button
                                    type="button"
                                    onClick={() => {
                                        setExR2Checked(true);
                                        const ok = exR2Answers[1] === exR2Solutions[1] && exR2Answers[2] === exR2Solutions[2];
                                        showToast(ok ? '🎉 Höfliche Redemittel perfekt formuliert!' : '⚠️ Achten Sie auf die Wortstellung!');
                                    }}
                                    className="w-full bg-brand-dark text-white py-2 rounded-full font-black text-xs shadow-chunky-sm"
                                >
                                    Check R2 Entschuldigung
                                </button>
                            </div>

                            {/* Chapter 4 Completion Card */}
                            <div className="bg-brand-mint text-brand-mintDark rounded-3xl p-5 border-2 border-brand-dark shadow-chunky space-y-2 text-center">
                                <span className="material-symbols-rounded text-3xl">verified</span>
                                <h3 className="text-lg font-black leading-tight text-brand-dark">Kapitel 4 Workbook abgeschlossen!</h3>
                                <p className="text-xs font-semibold text-zinc-700">
                                    Hervorragend! You have practiced workplace vocabulary, Konjunktiv II, and prepositional verbs with da(r)-. Advance to Chapter 5!
                                </p>
                                <a
                                    href="../b1_coursebook/cp5-b1coursebook.html"
                                    className="inline-flex items-center gap-1.5 bg-brand-dark hover:bg-zinc-800 text-white font-black text-xs px-5 py-2.5 rounded-full border border-brand-dark shadow-chunky-sm transition mt-2"
                                >
                                    <span>Advance to Coursebook 5</span>
                                    <span>&rarr;</span>
                                </a>
                            </div>
                        </main>
                    )}

                    {/* FIXED BOTTOM NAVIGATION DOCK */}
                    <nav className="fixed bottom-3 left-0 right-0 z-40 max-w-md md:max-w-xl mx-auto px-4 pointer-events-none">
                        <div className="bg-brand-dark/95 text-white backdrop-blur-lg p-2 rounded-full border-2 border-brand-dark shadow-2xl flex items-center justify-between pointer-events-auto">
                            <a
                                href="../../course-map-b1.html"
                                className="flex-1 py-2 rounded-full flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold text-zinc-400 hover:text-white transition"
                            >
                                <span className="material-symbols-rounded text-base">arrow_back</span>
                                <span>Course Map</span>
                            </a>

                            {/* Previous Section Button */}
                            <button
                                onClick={() => {
                                    if (currentSectionIndex > 0) {
                                        setActiveSection(SECTIONS[currentSectionIndex - 1].id);
                                        window.scrollTo({ top: 120, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentSectionIndex === 0}
                                className={`flex-1 py-2 rounded-full flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold transition ${
                                    currentSectionIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'text-zinc-400 hover:text-white'
                                }`}
                            >
                                <span className="material-symbols-rounded text-base">navigate_before</span>
                                <span>Prev Page</span>
                            </button>

                            {/* Section indicator pill */}
                            <div className="px-2 py-1 bg-brand-yellow text-brand-dark rounded-full text-[10px] font-black border border-brand-dark">
                                {SECTIONS[currentSectionIndex].label}
                            </div>

                            {/* Next Section Button */}
                            <button
                                onClick={() => {
                                    if (currentSectionIndex < SECTIONS.length - 1) {
                                        setActiveSection(SECTIONS[currentSectionIndex + 1].id);
                                        window.scrollTo({ top: 120, behavior: 'smooth' });
                                    }
                                }}
                                disabled={currentSectionIndex === SECTIONS.length - 1}
                                className={`flex-1 py-2 rounded-full flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold transition ${
                                    currentSectionIndex === SECTIONS.length - 1 ? 'opacity-30 cursor-not-allowed' : 'text-zinc-400 hover:text-white'
                                }`}
                            >
                                <span className="material-symbols-rounded text-base">navigate_next</span>
                                <span>Next Page</span>
                            </button>

                            <a
                                href="../b1_coursebook/cp4-b1coursebook.html"
                                className="flex-1 py-2 rounded-full flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold text-brand-yellow hover:text-white transition"
                            >
                                <span className="material-symbols-rounded text-base">menu_book</span>
                                <span>Coursebook</span>
                            </a>
                        </div>
                    </nav>

                    {/* LIGHTBOX MODAL */}
                    {lightboxImg && (
                        <div 
                            className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200"
                            onClick={() => setLightboxImg(null)}
                        >
                            <div className="bg-white rounded-3xl p-3 max-w-lg w-full border-2 border-brand-dark shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <button
                                    type="button"
                                    onClick={() => setLightboxImg(null)}
                                    className="absolute top-3 right-3 w-8 h-8 rounded-full bg-brand-cream border border-brand-dark text-brand-dark flex items-center justify-center font-black"
                                >
                                    &times;
                                </button>
                                <img src={lightboxImg} alt="Workbook zoom view" className="w-full h-auto rounded-2xl" />
                            </div>
                        </div>
                    )}

                    {/* SIGN OUT CONFIRMATION MODAL */}
                    {showLogoutModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full max-w-sm rounded-t-4xl sm:rounded-4xl border-2 border-brand-dark shadow-2xl p-6 text-center animate-in zoom-in-95 duration-200">
                                <div className="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3 border border-red-200">
                                    <span className="material-symbols-rounded text-2xl font-bold">logout</span>
                                </div>
                                <h4 className="text-lg font-black text-brand-dark">Sign Out of GermanApp?</h4>
                                <p className="text-xs text-zinc-600 font-semibold mt-1">
                                    Your workbook progress is preserved. You can resume anytime.
                                </p>

                                <div className="mt-5 flex gap-2">
                                    <button 
                                        onClick={() => setShowLogoutModal(false)}
                                        className="flex-1 bg-zinc-100 hover:bg-zinc-200 text-brand-dark py-2.5 rounded-full font-extrabold text-xs transition"
                                    >
                                        Stay
                                    </button>
                                    <button 
                                        onClick={async () => {
                                            try {
                                                await fetch('/api/logout', { method: 'POST' });
                                            } catch (e) {}
                                            window.location.href = '../../index.html';
                                        }}
                                        className="flex-1 bg-brand-coral hover:bg-red-600 text-white py-2.5 rounded-full font-extrabold text-xs shadow-md transition"
                                    >
                                        Log Out
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOAST NOTIFICATION */}
                    {toastMessage && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-brand-dark text-white text-xs font-black px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border border-brand-yellow animate-bounce">
                            <span className="w-2 h-2 rounded-full bg-brand-yellow"></span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
