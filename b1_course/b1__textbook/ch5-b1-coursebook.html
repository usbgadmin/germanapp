        const AudioPlayerCard = ({ title, src, onPlay }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const audio = audioRef.current;
                return () => {
                    if (audio) {
                        try {
                            audio.pause();
                        } catch (e) {}
                    }
                };
            }, [src]);

            const toggleAudio = () => {
                const audio = audioRef.current;
                if (!audio) return;

                if (!audio.paused) {
                    audio.pause();
                    setIsPlaying(false);
                } else {
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                setIsPlaying(true);
                                if (onPlay) onPlay(title);
                            })
                            .catch((err) => {
                                if (err.name !== 'AbortError') {
                                    console.warn('Audio playback error:', err);
                                }
                                setIsPlaying(false);
                            });
                    }
                }
            };

            return (
                <div className="bg-white border-2 border-brand-dark rounded-2xl p-2.5 sm:p-3 flex items-center justify-between gap-3 shadow-chunky-sm">
                    <div className="flex items-center gap-2.5 truncate">
                        <button
                            type="button"
                            onClick={toggleAudio}
                            className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 border-2 border-brand-dark shadow-chunky-sm transition active:translate-y-0.5 ${
                                isPlaying ? 'bg-brand-coral text-white' : 'bg-brand-yellow text-brand-dark hover:bg-yellow-400'
                            }`}
                            aria-label={isPlaying ? 'Pause Audio' : 'Play Audio'}
                        >
                            <span className="material-symbols-rounded text-lg">
                                {isPlaying ? 'pause' : 'play_arrow'}
                            </span>
                        </button>
                        <div className="truncate">
                            <span className="text-[10px] font-black uppercase tracking-wider text-brand-coral block leading-none">Hörtext Audio</span>
                            <span className="text-xs font-black text-brand-dark truncate block mt-0.5">{title}</span>
                        </div>
                    </div>
                    <audio 
                        ref={audioRef} 
                        src={src} 
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        onEnded={() => setIsPlaying(false)}
                        preload="none"
                    />
                    <a
                        href={src}
                        target="_blank"
                        rel="noreferrer"
                        className="text-zinc-400 hover:text-brand-dark p-1 rounded-lg"
                        title="Open direct audio file"
                    >
                        <span className="material-symbols-rounded text-base">open_in_new</span>
                    </a>
                </div>
            );
        };

                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch((err) => {
                            if (err.name !== 'AbortError') {
                                console.warn('Video play error:', err);
                            }
                        });
                    }

                return () => {
                    if (video) {
                        try {
                            video.pause();
                        } catch (e) {}
                    }

            }, [src]);

            return (
                <div 
                    className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200"
